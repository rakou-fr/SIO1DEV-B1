<html lang="fr">

    <link rel="stylesheet" href="main.css">

<body>
    <h1>ht12 :  drapeau français</h1>

        <tr>

            <td class="rouge"></td>
        </tr>

    <h1>ht12b :</h1>
    <h2>drapeau français, belge et italien puis LGBTQ+</h2>
    <h3>drapeau français</h3>
    <table>
        <tr>
            <td class="bleu"></td>
            <td class="blanc"></td>
            <td class="rouge"></td>
        </tr>
    </table>
    <h3>drapeau belge</h3>
    <table>
        <tr>
            <td class="noir"></td>
            <td class="jaune"></td>
            <td class="rouge"></td>
        </tr>
    </table>
    <h3>drapeau italien</h3>
    <table>
        <tr>
            <td class="vert"></td>
            <td class="blanc"></td>
            <td class="rouge"></td>
        </tr>
    </table>
    <h3>drapeau LGBTQ+</h3>
    <table>
        <tr><td class="rouge"></td></tr>
        <tr><td class="orange"></td></tr>
        <tr><td class="jaune"></td></tr>
        <tr><td class="vert"></td></tr>
        <tr><td class="bleu"></td></tr>
        <tr><td class="violet"></td></tr>
    </table>
